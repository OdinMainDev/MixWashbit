<svg width="1200" height="600" viewBox="0 0 1200 600"
     xmlns="http://www.w3.org/2000/svg">

    <!-- SKY -->
    <rect width="1200" height="600" fill="#f7f2e8"/>

    <!-- SUN -->
    <circle cx="1050" cy="140" r="70" fill="#ffe27a"/>

    <!-- CLOUDS -->
    <g fill="#ffffff" opacity="0.95">
        <circle cx="220" cy="130" r="45"/>
        <circle cx="260" cy="120" r="50"/>
        <circle cx="300" cy="140" r="40"/>
        <circle cx="255" cy="155" r="42"/>

        <circle cx="820" cy="110" r="40"/>
        <circle cx="860" cy="95" r="48"/>
        <circle cx="900" cy="115" r="38"/>
        <circle cx="855" cy="135" r="42"/>
    </g>

    <!-- GROUND WITH WAVES -->
    <path d="
        M 0 330
        C 150 300, 250 350, 350 330
        C 450 310, 550 360, 650 330
        C 750 300, 900 360, 1200 330
        L 1200 600
        L 0 600
        Z"
        fill="#c6dba3"/>
</svg>
